name: MadaBootstrap CI

on:
  push:
    branches:
      - rebrand-madabootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\MadaBootstrap\MadaBootstrap.csproj

      - name: Build
        run: dotnet build .\MadaBootstrap\MadaBootstrap.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish .\MadaBootstrap\MadaBootstrap.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o .\publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadaBootstrap-win-x64
          path: .\publish\*
